<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HexUnit — Personal Code Library</title>
<style>
:root{--bg:#07090d;--panel:#0d1118;--panel2:#121925;--line:#202b3b;--text:#f5f7fb;--muted:#8b98aa;--accent:#7c5cff;--accent2:#a996ff;--glow:#9b7cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#26165f 0,transparent 35%),radial-gradient(circle at 90% 30%,#101d3b 0,transparent 28%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(30deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%,#fff),linear-gradient(150deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%,#fff),linear-gradient(30deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%,#fff),linear-gradient(150deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%,#fff),linear-gradient(60deg,#fff 25%,transparent 25.5%,transparent 75%,#fff 75%);background-size:80px 140px;background-position:0 0,0 0,40px 70px,40px 70px,0 0}
button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;top:0;left:0;right:0;width:100%;height:70px;z-index:20;border-bottom:1px solid var(--line);padding:10px 24px;background:rgba(7,10,16,.96);backdrop-filter:blur(16px);display:flex;align-items:center;gap:28px}.brand{padding:0}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:850;flex:0 0 auto}.nav{display:flex;align-items:center;gap:4px;height:100%}.hex{width:30px;height:34px;display:grid;place-items:center;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:linear-gradient(135deg,var(--accent),#43d9ff);color:#fff;font-size:18px;filter:drop-shadow(0 0 10px #7c5cff77)}.brand span{color:var(--accent2)}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:center;padding:10px 16px;border-radius:10px;white-space:nowrap;height:40px}.nav button.active,.nav button:hover{background:linear-gradient(135deg,#17142b,#101a28);border-color:#332b59;color:var(--text);box-shadow:0 0 22px #7c5cff12}.nav button.active,.nav button:hover{background:linear-gradient(135deg,#17142b,#101a28);border-color:#332b59;color:var(--text);box-shadow:0 0 22px #7c5cff12}.main{flex:1;padding:105px 34px 34px;max-width:1450px;margin:auto;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.title h1{margin:0;font-size:32px;letter-spacing:-.5px}.title p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:9px}.btn:hover{border-color:#4a3e78}.btn.primary{background:linear-gradient(135deg,#7655ff,#925dff);border-color:#8d72ff;font-weight:750;box-shadow:0 8px 30px #7c5cff25}.code-disto{position:relative;margin-bottom:26px;padding:30px;border:1px solid #2d3450;border-radius:22px;background:linear-gradient(145deg,#101525e8,#0a0e16e8);overflow:hidden;box-shadow:0 18px 60px #0006}.code-disto:before,.code-disto:after{content:"";position:absolute;width:170px;height:190px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:#15112a;opacity:.8}.code-disto:before{right:-30px;top:-65px}.code-disto:after{left:-60px;bottom:-90px;background:#0f1a2c}.disto-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:17px}.disto-head h2{margin:0;font-size:22px}.disto-head p{margin:4px 0 0;color:var(--muted)}.search-wrap{position:relative;z-index:1}.search{width:100%;background:#080b11cc;border:1px solid #30394e;color:var(--text);padding:15px 18px 15px 46px;border-radius:13px;outline:none;transition:.2s;box-shadow:inset 0 0 0 1px #ffffff03}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cff18,0 0 28px #7c5cff12}.search-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--accent2);font-size:18px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.chip{border:1px solid var(--line);background:#0d121b;color:var(--muted);padding:7px 11px;border-radius:999px}.chip.active{color:white;border-color:#755cff;background:#24194a;box-shadow:0 0 16px #7c5cff20}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.card{position:relative;background:linear-gradient(145deg,#111722,#0a0e15);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:190px;display:flex;flex-direction:column;overflow:hidden;transition:.2s}.card:before{content:"";position:absolute;right:-22px;top:-30px;width:80px;height:90px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:#17142b}.card:hover{transform:translateY(-2px);border-color:#463b6d;box-shadow:0 12px 35px #0007,0 0 25px #7c5cff0d}.card h3{position:relative;margin:0 0 6px}.desc{color:var(--muted);min-height:45px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}.tag{color:var(--accent2);background:#20183a;padding:4px 8px;border-radius:6px;font-size:12px}.empty{border:1px dashed var(--line);border-radius:16px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1;background:#0d1118aa}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.dialog{width:min(720px,100%);background:#0d1118;border:1px solid #30394e;border-radius:18px;padding:24px;box-shadow:0 25px 80px #0008}.dialog h2{margin-top:0}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:600}.field input,.field textarea{background:#080b11;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:8px;outline:none}.field textarea{min-height:240px;resize:vertical;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.detail pre{background:#080b10;border:1px solid var(--line);padding:18px;border-radius:10px;overflow:auto;max-height:60vh;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.small{font-size:12px;color:var(--muted)}
@media(max-width:750px){.sidebar{height:112px;padding:10px 14px;align-items:flex-start;flex-direction:column;gap:8px}.brand{height:34px}.nav{width:100%;height:44px;overflow-x:auto}.nav button{white-space:nowrap;flex:0 0 auto}.main{padding:130px 20px 20px}.top{align-items:flex-start;flex-direction:column}.code-disto{padding:22px}.disto-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="hex">⬡</span><span>HexUnit</span></div><div class="nav"><button class="active" onclick="setView('all',this)">All Code</button><button onclick="setView('list',this)">Code List</button><button onclick="setView('favorites',this)">Favorites</button><button onclick="setView('recent',this)">Recently Added</button></div></aside>
<main class="main">
<header class="top"><div class="title"><h1>My Code Library</h1><p>Your personal, searchable code collection.</p></div></header>
<section class="code-disto"><div class="disto-head"><div><h2>⬡ Code Distribution</h2><p>Search through your code collection.</p></div><span class="small">HEX // INDEX</span></div><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" placeholder="Search titles, descriptions, categories, or code..." oninput="render()"></div></section>
<div id="chips" class="chips"></div><section id="grid" class="grid"></section>
</main></div>
<div id="detail" class="modal"><div class="dialog"><div class="detail"><button class="btn" onclick="closeDetail()">← Back</button><h2 id="dtitle"></h2><p id="ddesc" class="desc"></p><div id="dtag"></div><pre id="dcode"></pre></div></div></div>
<script src="decoder/decoder.js"></script>
<script>
const KEY='hexlab-code-v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]');let category='All';let view='all';
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function setView(v,el){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function openDetail(id){const x=items.find(i=>i.id===id);document.getElementById('dtitle').textContent=x.title;document.getElementById('ddesc').textContent=x.description||'No description';document.getElementById('dtag').innerHTML='<span class="tag">'+x.category+'</span>';document.getElementById('dcode').textContent=x.code;document.getElementById('detail').classList.add('open')}
function closeDetail(){document.getElementById('detail').classList.remove('open')}
function toggleFav(id,e){e.stopPropagation();const x=items.find(i=>i.id===id);x.favorite=!x.favorite;save();render()}
function del(id,e){e.stopPropagation();if(confirm('Delete this code?')){items=items.filter(i=>i.id!==id);save();render()}}
function render(){const q=document.getElementById('search').value.toLowerCase();let cats=['All',...new Set(items.map(i=>i.category))];document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip '+(category===c?'active':'')+'" onclick="category='+JSON.stringify(c)+';render()">'+c+'</button>').join('');
let data=items.filter(i=>(category==='All'||i.category===category)&&(!q||(i.title+' '+i.description+' '+i.category+' '+i.code).toLowerCase().includes(q)));if(view==='favorites')data=data.filter(i=>i.favorite);if(view==='recent')data=data.slice().sort((a,b)=>b.created-a.created).slice(0,10);if(view==='list')data=data.slice().sort((a,b)=>a.title.localeCompare(b.title));
document.getElementById('grid').innerHTML=data.length?data.map(i=>'<article class="card" onclick="openDetail('+i.id+')"><h3>'+esc(i.title)+'</h3><p class="desc">'+esc(i.description||'No description')+'</p><div class="meta"><span class="tag">'+i.category+'</span><span><button class="btn" onclick="toggleFav('+i.id+',event)">'+(i.favorite?'★':'☆')+'</button> <button class="btn" onclick="del('+i.id+',event)">Delete</button></span></div></article>').join(''):'<div class="empty">No code saved yet.</div>'}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
render();
</script>
</body></html>
