<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HexLab — Personal Code Library</title>
<style>
:root{--bg:#0b0d12;--panel:#11141b;--panel2:#171b24;--line:#252b37;--text:#f3f5f7;--muted:#8d96a5;--accent:#8b5cf6;--accent2:#a78bfa;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1b1430 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:245px;border-right:1px solid var(--line);padding:24px 16px;background:#0d0f15;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;padding:0 10px 24px}.brand span{color:var(--accent2)}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;border-radius:9px}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{flex:1;padding:30px;max-width:1400px;margin:auto;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.title h1{margin:0;font-size:30px}.title p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 15px;border-radius:9px}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:13px 15px;border-radius:10px;margin-bottom:20px;outline:none}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 11px;border-radius:999px}.chip.active{color:white;border-color:var(--accent);background:#24194a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.card{background:linear-gradient(145deg,#12161f,#0f1218);border:1px solid var(--line);border-radius:13px;padding:18px;min-height:190px;display:flex;flex-direction:column}.card h3{margin:0 0 6px}.desc{color:var(--muted);min-height:45px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}.tag{color:var(--accent2);background:#20183a;padding:4px 8px;border-radius:6px;font-size:12px}.empty{border:1px dashed var(--line);border-radius:13px;padding:50px;text-align:center;color:var(--muted);grid-column:1/-1}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.dialog{width:min(720px,100%);background:#11141b;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 25px 80px #0008}.dialog h2{margin-top:0}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:600}.field input,.field textarea{background:#0b0e13;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:8px;outline:none}.field textarea{min-height:240px;resize:vertical;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.detail pre{background:#0a0c10;border:1px solid var(--line);padding:18px;border-radius:9px;overflow:auto;max-height:60vh;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.small{font-size:12px;color:var(--muted)}
@media(max-width:750px){.sidebar{display:none}.main{padding:20px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">⬡ <span>HexLab</span></div><div class="nav"><button class="active" onclick="setView('all',this)">All Code</button><button onclick="setView('favorites',this)">Favorites</button><button onclick="setView('recent',this)">Recently Added</button></div></aside>
<main class="main">
<header class="top"><div class="title"><h1>My Code Library</h1><p>Your personal, searchable code collection.</p></div><div class="actions"><button class="btn primary" onclick="openModal()">＋ Add Code</button></div></header>
<input id="search" class="search" placeholder="Search titles, descriptions, categories, or code..." oninput="render()">
<div id="chips" class="chips"></div><section id="grid" class="grid"></section>
</main></div>
<div id="modal" class="modal"><div class="dialog"><h2>Add code</h2>
<form id="form"><div class="field"><label>Title</label><input id="title" required placeholder="e.g. Animated Navbar"></div>
<div class="field"><label>Description</label><input id="description" placeholder="What does this code do?"></div>
<div class="field"><label>Code</label><textarea id="code" required placeholder="Paste your code here..."></textarea></div>
<div class="small">Category is detected automatically from the code.</div>
<div class="row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Code</button></div></form></div></div>
<div id="detail" class="modal"><div class="dialog"><div class="detail"><button class="btn" onclick="closeDetail()">← Back</button><h2 id="dtitle"></h2><p id="ddesc" class="desc"></p><div id="dtag"></div><pre id="dcode"></pre></div></div></div>
<script>
const KEY='hexlab-code-v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]');let category='All';let view='all';
const detect=(c)=>{const s=c.toLowerCase();if(/\b(import|from)\s+react|jsx|use(state|effect)|<\/?[a-z]+/.test(s)&&/react/.test(s))return'React';if(/<(!doctype|html|div|section|button|body)/.test(s))return'HTML';if(/\b(const|let|var|function|=>|console\.log|document\.)/.test(s))return'JavaScript';if(/\b(def|import|from|print\(|elif|async def|pip)\b/.test(s))return'Python';if(/\b(public|private|class|static void|System\.out)\b/.test(s))return'Java';if(/\b(fn main|println!|let mut|use std::)\b/.test(s))return'Rust';if(/\b(SELECT|FROM|INSERT INTO|CREATE TABLE|UPDATE)\b/i.test(s))return'SQL';if(/[#.]?[a-zA-Z][\w-]*\s*\{[^}]*:[^}]*\}/.test(s))return'CSS';if(/^\s*(#!\/bin\/|echo\s|sudo\s|apt\s|cd\s)/m.test(s))return'Shell';return'Other'};
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function setView(v,el){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function openModal(){document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('title').focus(),50)}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('form').reset()}
document.getElementById('form').onsubmit=e=>{e.preventDefault();const code=document.getElementById('code').value;items.unshift({id:Date.now(),title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim(),code,category:detect(code),favorite:false,created:Date.now()});save();closeModal();render()};
function openDetail(id){const x=items.find(i=>i.id===id);document.getElementById('dtitle').textContent=x.title;document.getElementById('ddesc').textContent=x.description||'No description';document.getElementById('dtag').innerHTML='<span class="tag">'+x.category+'</span>';document.getElementById('dcode').textContent=x.code;document.getElementById('detail').classList.add('open')}
function closeDetail(){document.getElementById('detail').classList.remove('open')}
function toggleFav(id,e){e.stopPropagation();const x=items.find(i=>i.id===id);x.favorite=!x.favorite;save();render()}
function del(id,e){e.stopPropagation();if(confirm('Delete this code?')){items=items.filter(i=>i.id!==id);save();render()}}
function render(){const q=document.getElementById('search').value.toLowerCase();let cats=['All',...new Set(items.map(i=>i.category))];document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip '+(category===c?'active':'')+'" onclick="category='+JSON.stringify(c)+';render()">'+c+'</button>').join('');
let data=items.filter(i=>(category==='All'||i.category===category)&&(!q||(i.title+' '+i.description+' '+i.category+' '+i.code).toLowerCase().includes(q)));if(view==='favorites')data=data.filter(i=>i.favorite);if(view==='recent')data=data.slice().sort((a,b)=>b.created-a.created).slice(0,10);
document.getElementById('grid').innerHTML=data.length?data.map(i=>'<article class="card" onclick="openDetail('+i.id+')"><h3>'+esc(i.title)+'</h3><p class="desc">'+esc(i.description||'No description')+'</p><div class="meta"><span class="tag">'+i.category+'</span><span><button class="btn" onclick="toggleFav('+i.id+',event)">'+(i.favorite?'★':'☆')+'</button> <button class="btn" onclick="del('+i.id+',event)">Delete</button></span></div></article>').join(''):'<div class="empty">No code yet. Click <b>Add Code</b> to save your first snippet.</div>'}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
render();
</script>
</body></html>
